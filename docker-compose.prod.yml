# =====================================================================
# DOCKER COMPOSE PRODUCTION - MASTER GAMBAR
# =====================================================================
# File ini dikhususkan untuk environment Production.
# Konfigurasi password, nama database, dll akan dibaca otomatis 
# dari file `.env.production` di root directory.
#
# JANGAN sertakan file ini atau `.env.production` ke dalam Git!
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: master-gambar:production
    container_name: master-gambar-app
    restart: always
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql  # Mencegah app membaca 127.0.0.1 dari file env
      TZ: Asia/Jakarta
    volumes:
      - app-code:/app-shared
      - storage-data:/var/www/html/storage/app
    networks:
      - master-gambar-network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '3.0'
        reservations:
          memory: 1G
          cpus: '1.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx
    restart: always
    depends_on:
      - app
    environment:
      TZ: Asia/Jakarta
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; exec nginx -g 'daemon off;'"    
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro
    networks:
      - master-gambar-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:9.7.0
    container_name: master-gambar-mysql
    restart: always
    env_file:
      - .env.production
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/healthcheck.sh:/healthcheck.sh:ro
      - mysql-backup:/backup
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - master-gambar-network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 1.5G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql-data:
  app-code:
  storage-data:
  mysql-backup:

networks:
  master-gambar-network:
    driver: bridge
