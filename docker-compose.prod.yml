# =====================================================================
# DOCKER COMPOSE PRODUCTION - MASTER GAMBAR
# =====================================================================
# File ini dikhususkan untuk environment Production.
# Konfigurasi password, nama database, dll akan dibaca otomatis 
# dari file `.env.production` di root directory.
#
# File ini SEKARANG AMAN disertakan ke dalam Git karena sudah
# tidak mengandung password. Semua password disimpan di `.env.production`.
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: master-gambar:production
    container_name: master-gambar-app
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: infra-mysql  # Konek ke mysql infra
      TZ: Asia/Jakarta
    volumes:
      - app-code:/app-shared
      - storage-data:/var/www/html/storage/app
    networks:
      - rekayasa-network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '3.0'
        reservations:
          memory: 1G
          cpus: '1.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx
    restart: always
    depends_on:
      - app
    environment:
      TZ: Asia/Jakarta
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; exec nginx -g 'daemon off;'"
    # NGINX TIDAK EXPOSE PORT KE HOST.
    # Traffic akan dilempar dari Nginx Proxy Manager di network infra
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro
    networks:
      - rekayasa-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-code:
  storage-data:

networks:
  rekayasa-network:
    external: true
