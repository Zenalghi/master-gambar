services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: master-gambar:production
    container_name: master-gambar-app
    restart: always
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker.example
    environment:
      APP_URL: http://IP_SERVER_ANDA:8080 # <-- GANTI DENGAN IP/DOMAIN SERVER
      DB_HOST: mysql
      DB_PASSWORD: *app_pass
      MYSQL_ROOT_PASSWORD: *root_pass
    volumes:
      # HANYA VOLUME SHARED YANG DISISAKAN (TIDAK ADA LAGI .:/var/www/html)
      - app-code:/app-shared
      - storage-data:/var/www/html/storage/app
    networks:
      - master-gambar-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx
    restart: always
    depends_on:
      - app
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; nginx -g 'daemon off;'"
    ports:
      - "8080:80" # Akses web di server via port 8080
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro # Mengambil kode dari app container via shared volume
    networks:
      - master-gambar-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:9.7.0
    container_name: master-gambar-mysql
    restart: always
    env_file:
      - .env.docker.example
    environment:
      MYSQL_ROOT_PASSWORD: *root_pass
      MYSQL_PASSWORD: *app_pass
      MYSQL_DATABASE: db_master
    ports:
      - "127.0.0.1:3307:3306" # Hanya bisa diakses dari localhost server (aman)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/healthcheck.sh:/healthcheck.sh:ro
      - mysql-backup:/backup
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - master-gambar-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql-data:
  app-code:
  storage-data:
  mysql-backup:

networks:
  master-gambar-network:
    driver: bridge
