# =====================================================================
# DOCKER COMPOSE DEVELOPMENT - MASTER GAMBAR
# =====================================================================
# Lingkungan:
#   Membaca dari file .env di root project.
#   (DB_HOST di .env bisa diset ke 127.0.0.1 untuk Laragon,
#    namun akan dioverride menjadi "mysql" oleh file ini untuk Docker).
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: master-gambar:development
    container_name: master-gambar-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql  # OVERRIDE .env agar Docker pakai internal network
      TZ: Asia/Jakarta
      XDEBUG_MODE: develop,debug,coverage
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
      PHP_IDE_CONFIG: serverName=master-gambar-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
    networks:
      - master-gambar-dev-network
    ports:
      - "9003:9003"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    depends_on:
      - app
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; exec nginx -g 'daemon off;'"
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    networks:
      - master-gambar-dev-network

  mysql:
    image: mysql:9.7.0
    container_name: master-gambar-mysql-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - master-gambar-dev-network

volumes:
  mysql-data-dev:
  app-code-dev:
  storage-data-dev:

networks:
  master-gambar-dev-network:
    driver: bridge