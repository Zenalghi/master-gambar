services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: master-gambar:latest
    container_name: master-gambar-app
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - app-code:/app-shared
      - storage-data:/var/www/html/storage/app
    networks:
      - master-gambar-network

  nginx:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx
    depends_on:
      - app
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; nginx -g 'daemon off;'"
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro
    networks:
      - master-gambar-network

  mysql:
    image: mysql:9.7.0
    container_name: master-gambar-mysql
    environment:
      MYSQL_DATABASE: db_master
      MYSQL_ROOT_PASSWORD: s3cur3_mysql_r00t
      MYSQL_USER: app
      MYSQL_PASSWORD: s3cur3_mysql_4pp
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ps3cur3_mysql_r00t"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - master-gambar-network

volumes:
  mysql-data:
  app-code:
  storage-data:

networks:
  master-gambar-network:
    driver: bridge
