services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: master-gambar:latest
    container_name: master-gambar-app
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker.example  # <--- Langsung membaca file example sebagai base template
    environment:
      - APP_URL=http://localhost:8888  # Menimpa URL agar mengarah ke port Docker Nginx
    volumes:
      - .:/var/www/html        # Bind folder agar perubahan kode di VS Code langsung instan
      - app-code:/app-shared
      - storage-data:/var/www/html/storage/app
    networks:
      - master-gambar-network

  nginx:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx
    depends_on:
      - app
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; nginx -g 'daemon off;'"
    ports:
      - "8888:80"  # <--- Port 8888 di PC Anda (Laragon aman menggunakan port 80)
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    networks:
      - master-gambar-network

  mysql:
    image: mysql:9.7.0
    container_name: master-gambar-mysql
    env_file:
      - .env.docker.example  # <--- Menggunakan base template yang sama
    environment:
      - MYSQL_ROOT_PASSWORD=rahasia_root  # Tulis password root di sini jika ingin mengubahnya
      - MYSQL_PASSWORD=rahasia_app       # Tulis password user di sini jika ingin mengubahnya
      - MYSQL_DATABASE=db_master
    ports:
      - "3307:3306"  # <--- Port 3307 di PC Anda (Laragon aman menggunakan port 3306)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - master-gambar-network

volumes:
  mysql-data:
  app-code:
  storage-data:

networks:
  master-gambar-network:
    driver: bridge