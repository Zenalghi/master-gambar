# =====================================================================
# DOCKER COMPOSE DEVELOPMENT - MASTER GAMBAR
# =====================================================================
# Cara pakai:
#   1. Copy secrets:    cp docker/.env.dev.secrets.example docker/.env.dev.secrets
#   2. Edit password:   nano docker/.env.dev.secrets
#   3. Jalankan:        docker compose -f docker-compose.dev.yml up -d --build
# =====================================================================

services:
  app-dev:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: master-gambar:development
    container_name: master-gambar-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      mysql-dev:
        condition: service_healthy
    env_file:
      - docker/.env.dev.secrets
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://192.168.100.173:8081
      XDEBUG_MODE: develop,debug,coverage
      XDEBUG_CONFIG: client_host=192.168.100.173 client_port=9003
      PHP_IDE_CONFIG: serverName=master-gambar-dev
    volumes:
      - app-code-dev:/app-shared
      - storage-data-dev:/var/www/html/storage/app
    networks:
      - master-gambar-dev-network
    ports:
      - "9003:9003"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx-dev:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx-dev
    restart: unless-stopped
    depends_on:
      - app-dev
    command: sh -c "until [ -f /var/www/html/public/index.php ]; do sleep 2; done; exec nginx -g 'daemon off;'"
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code-dev:/var/www/html:ro
    networks:
      - master-gambar-dev-network

  mysql-dev:
    image: mysql:9.7.0
    container_name: master-gambar-mysql-dev
    restart: unless-stopped
    env_file:
      - docker/.env.dev.secrets
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - master-gambar-dev-network

  phpmyadmin-dev:
    image: phpmyadmin:5.2
    container_name: master-gambar-phpmyadmin-dev
    restart: unless-stopped
    depends_on:
      - mysql-dev
    environment:
      PMA_HOST: mysql-dev
      PMA_PORT: 3306
    ports:
      - "8082:80"
    networks:
      - master-gambar-dev-network

volumes:
  mysql-data-dev:
  app-code-dev:
  storage-data-dev:

networks:
  master-gambar-dev-network:
    driver: bridge
