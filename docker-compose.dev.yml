# =====================================================================
# DOCKER COMPOSE DEVELOPMENT - MASTER GAMBAR
# =====================================================================
#
# File ini untuk development environment di VM Server
# Production tetap menggunakan docker-compose.prod.yml
#
# Cara jalankan:
#   1. Copy template env:  cp docker/.env.dev.example docker/.env.dev
#   2. Edit password:      nano docker/.env.dev
#   3. Jalankan:           docker compose -f docker-compose.dev.yml up -d --build
#
# Akses:
#   - App: http://192.168.100.173:8081
#   - MySQL: 127.0.0.1:3308
#   - phpMyAdmin: http://192.168.100.173:8082
# =====================================================================

services:
  app-dev:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: master-gambar:development
    container_name: master-gambar-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      mysql-dev:
        condition: service_healthy
    env_file:
      - docker/.env.dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://192.168.100.173:8081
      DB_HOST: mysql-dev
      DB_PORT: 3306
      DB_DATABASE: db_master_dev
      DB_USERNAME: dev
      # DB_PASSWORD dibaca dari docker/.env.dev
      # Xdebug configuration
      XDEBUG_MODE: develop,debug,coverage
      XDEBUG_CONFIG: client_host=192.168.100.173 client_port=9003
      PHP_IDE_CONFIG: serverName=master-gambar-dev
    volumes:
      - .:/var/www/html
      - storage-data-dev:/var/www/html/storage/app
    networks:
      - master-gambar-dev-network
    ports:
      - "9003:9003"  # Xdebug port
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx-dev:
    image: nginx:1.27-alpine
    container_name: master-gambar-nginx-dev
    restart: unless-stopped
    depends_on:
      - app-dev
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    networks:
      - master-gambar-dev-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql-dev:
    image: mysql:9.7.0
    container_name: master-gambar-mysql-dev
    restart: unless-stopped
    env_file:
      - docker/.env.dev
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_USER: dev
      MYSQL_DATABASE: db_master_dev
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - master-gambar-dev-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin-dev:
    image: phpmyadmin:5.2
    container_name: master-gambar-phpmyadmin-dev
    restart: unless-stopped
    depends_on:
      - mysql-dev
    environment:
      PMA_HOST: mysql-dev
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "8082:80"
    networks:
      - master-gambar-dev-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  mysql-data-dev:
  storage-data-dev:

networks:
  master-gambar-dev-network:
    driver: bridge
