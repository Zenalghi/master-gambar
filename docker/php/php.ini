; =====================================================================
; PHP Configuration for Master Gambar
; Optimized for PDF processing, Ghostscript, and image manipulation
; =====================================================================

; ---- Memory (CRITICAL for PDF/Image processing) ----
; Ghostscript + PDF generation can use 1-2GB per process
memory_limit=2048M

; ---- File Upload Limits ----
upload_max_filesize=128M
post_max_size=128M
max_file_uploads=20

; ---- Execution Time ----
; PDF processing can take several minutes
max_execution_time=600
max_input_time=600

; ---- Realpath Cache ----
realpath_cache_size=4096K
realpath_cache_ttl=600

; ---- OPcache (Performance) ----
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2
opcache.fast_shutdown=1

; ---- Session ----
session.gc_maxlifetime=3600

; ---- Date ----
[Date]
date.timezone=Asia/Jakarta

; ---- Error Logging ----
log_errors=On
error_log=/var/log/php_errors.log
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors=Off
display_startup_errors=Off
