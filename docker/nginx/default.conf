server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # ---- Upload Limits ----
    # Support large PDF uploads and ZIP downloads
    client_max_body_size 256M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # ---- Timeouts for long-running processes ----
    # PDF generation can take several minutes
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    fastcgi_connect_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ---- Main Location ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP Processing ----
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Increase buffer for large responses
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ---- Static Assets ----
    location ~* \.(?:css|js|map|ico|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- PDF Files (no cache for dynamic PDFs) ----
    location ~* \.pdf$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
